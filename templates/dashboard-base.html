<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Weather (Beta)</title>
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
    <div class="dashboard-container" ondblclick="toggleSidebar()">
        <aside class="sidebar">
            <div class="brand">
                <img src="assets/d39432cd6c2a9b480ea2285ff615404f.svg" alt="GassWatt Logo" class="brand-logo" />
                <span class="brand-name">GassWatt</span>
            </div>

            <nav class="sidebar-nav">
                <a href="#" class="nav-item">
                    <img src="assets/94c1b8fc7f33a5ce8c5019c595e4b99e.svg" alt="Dashboard" class="nav-icon" />
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item">
                    <img src="assets/a6d64cbd31e89e7fc2c87c1b869a852b.svg" alt="Survey" class="nav-icon" />
                    <span>Survey</span>
                </a>
                <a href="#" class="nav-item active">
                    <img src="assets/4894e410a6b19da4638ca211409e13aa.svg" alt="Weather" class="nav-icon" />
                    <span>Weather</span>
                </a>
                <a href="#" class="nav-item">
                    <img src="assets/d721722cbcb65abb555acf4488fc1283.svg" alt="Emission" class="nav-icon" />
                    <span>Emission</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="bg-blur blur-1"></div>
            <div class="bg-blur blur-2"></div>

            <header class="top-header">
                <div class="search-bar">
                    <img src="assets/544211f0432ffbfba7e26a1ee43269a0.svg" alt="Search Icon" class="search-icon" />
                    <input type="text" placeholder="Search" />
                </div>

                <div class="user-profile">
                    <img src="assets/9ab56f316bd0f859404ffe6f6f2870e8.png" alt="Avatar" class="profile-avatar" />
                    <div class="profile-info">
                        <span class="user-name">Nama User</span>
                        <span class="user-role">Dashboard</span>
                    </div>
                </div>
            </header>

            <section class="welcome-section">
                <h2>Mari lihat rekomendasi cuaca kamu hari ini.</h2>
            </section>

        </main>
    </div>
    <script src="/static/js/sidebar.js"></script>
</body>
</html>
