{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/dashboard-style.css' %}" />
    {% block meta %}{% endblock %}
</head>
<body>
    <div class="dashboard-container" ondblclick="toggleSidebar()">
        <aside class="sidebar">
            <div class="brand">
                <img src="" alt="GassWatt Logo" class="brand-logo" />
                <span class="brand-name">GassWatt</span>
            </div>

            <nav class="sidebar-nav">
                <a href="{% url 'main:show_dashboard' %}" class="nav-item {% if request.resolver_match.url_name == 'show_dashboard' %}active{% endif %}">
                    <img src="" alt="Dashboard" class="nav-icon" />
                    <span>Dashboard</span>
                </a>
                <a href="{% url 'main:show_dashboard_survey' %}" class="nav-item {% if request.resolver_match.url_name == 'show_dashboard_survey' %}active{% endif %}">
                    <img src="" alt="Survey" class="nav-icon" />
                    <span>Survey</span>
                </a>
                <a href="{% url 'main:show_dashboard_weather' %}" class="nav-item {% if request.resolver_match.url_name == 'show_dashboard_weather' %}active{% endif %}">
                    <img src="" alt="Weather" class="nav-icon" />
                    <span>Weather</span>
                </a>
                <a href="{% url 'main:show_dashboard_emission' %}" class="nav-item {% if request.resolver_match.url_name == 'show_dashboard_emission' %}active{% endif %}">
                    <img src="" alt="Emission" class="nav-icon" />
                    <span>Emission</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="bg-blur blur-1"></div>
            <div class="bg-blur blur-2"></div>

            <header class="top-header">
                <div class="search-bar">
                    <img src="" alt="Search Icon" class="search-icon" />
                    <input type="text" placeholder="Search" />
                </div>

                <div class="user-profile">
                    <img src="" alt="Avatar" class="profile-avatar" />
                    <div class="profile-info">
                        <span class="user-name">Nama User</span>
                        <span class="user-role">Dashboard</span>
                    </div>
                </div>
            </header>

            {% block content %}{% endblock %}

        </main>
    </div>
    <script src="{% static 'js/sidebar.js' %}"></script>
</body>
</html>
