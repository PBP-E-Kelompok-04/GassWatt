{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/dashboard-style.css' %}" />
    {% block meta %}{% endblock %}
</head>
<body>
    <div class="dashboard-container" ondblclick="toggleSidebar()">
        <aside class="sidebar">
            <div class="brand">
                <a href="{% url 'main:show_home' %}" class="brand">
                    <img src="{% static 'img/logo.png' %}" alt="GassWatt Logo" class="brand-logo" />
                    <span class="brand-name">GassWatt</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <a href="{% url 'main:show_dashboard' %}" class="nav-item {% if request.resolver_match.url_name == 'show_dashboard' %}active{% endif %}">
                    <img src="{% static 'img/layout_dashboard.png' %}" alt="Dashboard" class="nav-icon" />
                    <span>Dashboard</span>
                </a>
                <a href="{% url 'main:show_dashboard_survey' %}" class="nav-item {% if request.resolver_match.url_name == 'show_dashboard_survey' %}active{% endif %}">
                    <img src="{% static 'img/survey.png' %}" alt="Survey" class="nav-icon" />
                    <span>Survey</span>
                </a>
                <a href="{% url 'main:show_dashboard_weather' %}" class="nav-item {% if request.resolver_match.url_name == 'show_dashboard_weather' %}active{% endif %}">
                    <img src="{% static 'img/cloud-sun.png' %}" alt="Weather" class="nav-icon" />
                    <span>Weather</span>
                </a>
                <a href="{% url 'main:emission_dashboard' %}" class="nav-item {% if request.resolver_match.url_name == 'emission_dashboard' %}active{% endif %}">
                    <img src="{% static 'img/leaf.png' %}" alt="Emission" class="nav-icon" />
                    <span>Emission</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="bg-blur blur-1"></div>
            <div class="bg-blur blur-2"></div>

            <header class="top-header">
                <div class="search-bar">
                    <img src="{% static 'img/search-icon.png' %}" alt="Search Icon" class="search-icon" />
                    <input type="text" placeholder="Search" id="searchInput"/>
                </div>

                <a href="{% url 'main:show_profile' %}" class="user-profile" style="text-decoration: none; color: inherit;">
                    <img src="{{ request.user.pfp.url }}" alt="Avatar" class="profile-avatar" />
                    <div class="profile-info">
                        <span class="user-name">{{ request.user.username|default:request.user.email }}</span>
                        <span class="user-role">Dashboard</span>
                    </div>
                </a>
            </header>

            {% block content %}{% endblock %}

        </main>
    </div>
    <script src="{% static 'js/sidebar.js' %}"></script>
</body>
</html>
