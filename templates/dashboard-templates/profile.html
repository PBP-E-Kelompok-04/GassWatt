{% extends "dashboard-templates/dashboard-base.html" %}
{% load static %}

{% block meta %}
<meta name="csrf-token" content="{{ csrf_token }}">
<link rel="stylesheet" href="{% static 'css/profile.css' %}">
{% endblock %}

{% block content %}
<section class="profile-page" id="profilePage"
         data-url-username="{% url 'main:update_username' %}"
         data-url-avatar="{% url 'main:update_avatar' %}"
         data-url-password="{% url 'main:change_password' %}">

    <div class="profile-card">
        <h2>Foto Profil</h2>

        <div class="avatar-wrapper" id="avatarWrapper"
             tabindex="0" role="button" aria-label="Ganti foto profil">
            <img
				src="{{ request.user.pfp.url }}"
				alt="Avatar"
				class="profile-avatar"
				onerror="this.onerror=null; this.src='{% get_media_prefix %}default.jpg';"
			>
            <div class="avatar-overlay">Ganti<br>foto</div>
        </div>

        <input type="file" id="avatarInput"
               accept="image/jpeg,image/png,image/webp" hidden>

        <p class="avatar-hint">JPEG, PNG atau WEBP, max 2 MB.</p>
        <p class="form-message" id="avatarMessage"></p>
    </div>

    <div class="profile-card">
        <h2>Ganti Username</h2>

        <form id="usernameForm" novalidate>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       value="{{ request.user.username|default:'' }}"
                       minlength="3" maxlength="20"
                       pattern="[\w.@+\-]{3,20}" required
                       autocomplete="username">
                <div class="field-hint">3-20 karakter: huruf, angka dan @ . + - _ saja.</div>
            </div>

            <button type="submit" class="btn-primary">Simpan username</button>
            <div class="form-message" id="usernameMessage"></div>
        </form>
    </div>

    <div class="profile-card">
        <h2>Ganti Password</h2>

        <form id="passwordForm" novalidate>
            <div class="form-group">
                <label for="old_password">Password sekarang</label>
                <input type="password" id="old_password" name="old_password"
                       required autocomplete="current-password">
            </div>

            <div class="form-group">
                <label for="new_password1">Password baru</label>
                <input type="password" id="new_password1" name="new_password1"
                       required autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="new_password2">Konfirmasi password baru</label>
                <input type="password" id="new_password2" name="new_password2"
                       required autocomplete="new-password">
            </div>

            <button type="submit" class="btn-primary">Ganti password</button>
            <div class="form-message" id="passwordMessage"></div>
        </form>
    </div>

</section>

<script src="{% static 'js/profile.js' %}" defer></script>
{% endblock %}
