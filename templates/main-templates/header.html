{% load static %}
{% with current=request.resolver_match.url_name %}
<header class="site-header">
    <div class="container">
        <div class="header-inner">
            <a href="{% url 'main:show_home' %}" class="brand">
                <img class="brand-icon" src="{% static 'img/logo.png' %}" alt="">
                <span class="brand-name">GassWatt</span>
            </a>

            <nav class="nav">
                <a href="{% url 'main:show_home' %}"
                    class="nav-link {% if current == 'show_home' %}active{% endif %}">Home</a>
                <a href="{% url 'main:show_about' %}"
                    class="nav-link {% if current == 'show_about' %}active{% endif %}">About</a>
                <a href="{% url 'main:show_faq' %}"
                    class="nav-link {% if current == 'show_faq' %}active{% endif %}">FAQ</a>
            </nav>

            <div class="header-actions">
                {% if user.is_authenticated %}
                    <span class="nav-user">{{ user.username }}</span>
                    <a href="{% url 'logout_user' %}" class="btn btn-outline">Logout</a>
                {% else %}
                    <a href="{% url 'show_login' %}" class="btn btn-outline">Sign In</a>
                    <a href="{% url 'show_register' %}"a class="btn btn-solid">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </div>
</header>
{% endwith %}
